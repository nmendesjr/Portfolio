<!DOCTYPE html>
<html lang="en" data-theme="light" data-accent="verde" data-display="serif" data-density="regular" data-layout="default" data-vibe="clear">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Naama Mendes Jr. — Product Leader</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="components.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function VibeToggle({ vibe, onChange }) {
  return (
    <div className="vibe-bar">
      <button
        className={"vibe-opt" + (vibe === "fun" ? " vibe-opt--on" : "")}
        onClick={() => onChange("fun")}
      >fun</button>
      <button
        className={"vibe-opt" + (vibe === "clear" ? " vibe-opt--on" : "")}
        onClick={() => onChange("clear")}
      >clear</button>
    </div>
  );
}

function App() {
  const [vibe, setVibe] = useState("clear");
  const [openId, setOpenId] = useState("tapcheck-director");
  const data = window.PORTFOLIO_DATA;

  useEffect(() => {
    const html = document.documentElement;
    if (vibe === "clear") {
      html.setAttribute("data-theme", "light");
    } else {
      html.setAttribute("data-theme", "dark");
    }
    html.setAttribute("data-vibe", vibe);
  }, [vibe]);

  useScrollReveal();

  return (
    <div className="app">
      <VibeToggle vibe={vibe} onChange={setVibe} />

      <Hero data={data} theme={vibe === "clear" ? "light" : "dark"} />

      <div data-reveal>
        <WorkList data={data} openId={openId} setOpenId={setOpenId} />
      </div>

      <div data-reveal>
        <About data={data} />
      </div>

      <div data-reveal>
        <Capabilities data={data} />
      </div>

      <div data-reveal>
        <Clients data={data} />
      </div>

      <div data-reveal>
        <Writing data={data} />
      </div>

      <Footer data={data} />

      <FloatingContact data={data} theme={vibe === "clear" ? "light" : "dark"} onToggleTheme={() => {}} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>

</body>
</html>
